name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip ruff coverage
      - name: Lint
        run: ruff check .
      - name: Tests with coverage (fails under 90%)
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=90
      - name: Sample trail verifies
        run: python measurement_trail.py verify samples/example.jsonl
      - name: pip install and run the console script
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          measurement-trail --version
          measurement-trail verify "$GITHUB_WORKSPACE/samples/example.jsonl"
          measurement-trail append trail.jsonl --event-json '{"timestamp":"2026-09-30T09:00:00Z","step":"ci","actor":"github-actions"}'
          measurement-trail verify trail.jsonl
