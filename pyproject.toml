[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "measurement-trail"
dynamic = ["version"]
description = "Offline, stdlib-only prototype for SHA-256 hash-chained measurement provenance trails (JSONL) with integrity verification"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Jean-François Brisson" }]
keywords = ["provenance", "hash-chain", "measurement", "integrity", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Repository = "https://github.com/sparkainlp-x/measurement-trail"

[project.scripts]
measurement-trail = "measurement_trail:main"

[tool.setuptools]
py-modules = ["measurement_trail"]

[tool.setuptools.dynamic]
version = { attr = "measurement_trail.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.coverage.run]
branch = true
include = ["measurement_trail.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
